name: Publish project site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .nojekyll
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

jobs:
  build:
    name: Stage static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify and stage public files only
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/site.css
          test -s assets/favicon.svg
          test -f .nojekyll
          mkdir -p _site/assets
          cp index.html .nojekyll _site/
          cp assets/site.css assets/favicon.svg _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
